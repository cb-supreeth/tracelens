plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

// premain and woven advice must load in legacy Java 8 applications as well.
tasks.named('compileJava', JavaCompile) {
    options.release = 8
}

dependencies {
    // Same ByteBuddy cb-ems uses (Java 21 compatible). Shaded + relocated below so the
    // agent never clashes with the app's own ByteBuddy (Hibernate) on the classpath.
    implementation 'net.bytebuddy:byte-buddy:1.15.11'

    // Core is shaded in (relocated) for config and the standalone store/API. The bridge
    // is EXCLUDED — it must exist exactly once, in the bootstrap loader (injected at
    // premain), or we get loader-constraint LinkageErrors.
    implementation(project(':tracelens-core')) {
        exclude group: 'com.chargebee', module: 'tracelens-bridge'
    }
    compileOnly project(':tracelens-bridge')

    testImplementation project(':tracelens-bridge')
    testImplementation 'net.bytebuddy:byte-buddy-agent:1.15.11'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
    // One JVM per test class: agent tests mutate JVM-global state (woven JDK classes,
    // bootstrap-injected bridge with static counters). Forking per class keeps them
    // hermetic — e.g. ExecutorWeavingTest injects the bridge into bootstrap, which
    // must not leak into other test classes' classloader view.
    forkEvery = 1
    dependsOn ':tracelens-bridge:compileJava'
}

def bridgeJarTask = project(':tracelens-bridge').tasks.named('jar', Jar)

// The ONLY valid agent artifact is the shaded fat jar (FlowLens lesson: the thin jar
// fails silently as a javaagent). We attach the 'agent' classifier to make that explicit:
//   tracelens-agent-0.1.1-SNAPSHOT-agent.jar  <- use this one
//   tracelens-agent-0.1.1-SNAPSHOT.jar        <- thin jar, library use only, never a javaagent
shadowJar {
    archiveClassifier.set('agent')
    mergeServiceFiles()

    // NOTE: embedding the bridge jar via shadowJar.from() exploded the jar instead of
    // copying it (Shadow treats archive sources as zip trees). Embedding happens in
    // processResources below instead — plain Copy semantics, jar copied as a file.

    // Relocate everything third-party and core so the agent is self-contained and
    // isolated from application dependencies. The bridge is
    // deliberately NOT shaded or relocated: woven bytecode references it by name.
    relocate 'net.bytebuddy', 'com.chargebee.tracelens.shaded.bytebuddy'
    relocate 'com.fasterxml.jackson', 'com.chargebee.tracelens.shaded.jackson'
    relocate 'com.chargebee.tracelens.core', 'com.chargebee.tracelens.shaded.core'

    manifest {
        attributes(
                'Premain-Class': 'com.chargebee.tracelens.agent.TraceLensAgent',
                'Agent-Class': 'com.chargebee.tracelens.agent.TraceLensAgent',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true'
        )
    }
}

// Embed the bridge jar as a resource inside the agent jar; premain extracts it to a
// temp file and appends it to the bootstrap classloader search.
// NB: the '.dat' extension is deliberate — ShadowJar explodes any *.jar it finds in
// its input stream, so the bridge is embedded under a neutral extension and renamed
// back to .jar when premain writes the temp file.
processResources {
    dependsOn bridgeJarTask
    from({ bridgeJarTask.get().archiveFile.get().asFile }) {
        into 'bridge'
        rename { 'tracelens-bridge.jar.dat' }
    }
}

build.dependsOn shadowJar

// Run explicitly with :tracelens-agent:java8Smoke on machines with a Java 8 JDK.
// Regular unit tests stay on Java 21; this exercises the delivered shaded jar and
// bootstrap bridge in a real Java 8 VM (including executor retransformation).
sourceSets {
    java8Smoke
}

dependencies {
    java8SmokeImplementation project(':tracelens-core')
}

tasks.named('compileJava8SmokeJava', JavaCompile) {
    options.release = 8
}

tasks.register('java8Smoke', JavaExec) {
    group = 'verification'
    description = 'Smoke-test the shaded agent and core in an installed Java 8 JVM.'
    dependsOn shadowJar, java8SmokeClasses
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
    classpath = sourceSets.java8Smoke.runtimeClasspath
    mainClass = 'com.chargebee.tracelens.compat.Java8AgentSmoke'
    doFirst {
        jvmArgs "-javaagent:${tasks.shadowJar.archiveFile.get().asFile.absolutePath}",
                "-Dtracelens.configPath=${file('src/java8Smoke/resources/tracelens-java8.json').absolutePath}"
    }
}
