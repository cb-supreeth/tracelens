[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelens-cli"
version = "0.1.0"
description = "CLI for TraceLens: list, export and render line-level execution traces from a running Chargebee service"
requires-python = ">=3.10"
# zero runtime dependencies by design (stdlib only) — trivially pipx-installable

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tracelens = "tracelens_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tracelens_cli*"]
