[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelens-cli"
version = "0.1.1"
description = "Test environment for the TraceLens cb-app bootstrap scripts; the viewer, CLI and MCP ship in the Java distribution"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

# No Python package ships from here: tracelens_cli/web holds the browser assets
# that tracelens-tool/build.gradle bundles into the Java distribution.
[tool.setuptools]
packages = []
