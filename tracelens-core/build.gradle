// tracelens-core: framework-agnostic trace model, in-memory store, context
// propagation, config and export. Pure Java — zero Spring/servlet imports so it
// survives the Spring Boot -> cb-framework migration unchanged.
plugins {
    id 'java-library'
}

dependencies {
    // Jackson is the only dependency (config parsing + export serialization).
    // The app provides it at runtime via Spring Boot; the agent shades it relocated.
    api 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
