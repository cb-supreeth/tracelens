// tracelens-core: framework-agnostic trace model, in-memory store, context
// propagation, config and export. Pure Java — zero Spring/servlet imports so it
// survives the Spring Boot -> cb-framework migration unchanged.
plugins {
    id 'java-library'
    id 'maven-publish'
}

// Runtime libraries support Java 8; tests still use the root Java 21 toolchain.
tasks.named('compileJava', JavaCompile) {
    options.release = 8
}

dependencies {
    // The bridge: correlation context + the runtime SPI the agent emits into.
    // At runtime in an agent-attached JVM these classes come from bootstrap (agent
    // injection); on the app classpath they are simply shadowed by that copy — which
    // also means the starter works in no-agent mode (context/debug API fine, just no
    // woven events).
    api project(':tracelens-bridge')

    // Jackson is the only third-party dependency (config parsing + export).
    // The app provides it at runtime via Spring Boot; the agent shades it relocated.
    api 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
