plugins {
    id 'java-library'
}

// The command-line entry point is separate from premain, but the combined
// artifact must remain usable by teammates whose application runs on Java 8.
tasks.named('compileJava', JavaCompile) {
    options.release = 8
}

dependencies {
    api 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    from('../scripts/java-bundle/tracelens.json') {
        into 'tracelens-setup'
        rename { 'cb-app.json' }
    }
    from('../scripts/java-bundle/ems/tracelens.json') {
        into 'tracelens-setup'
        rename { 'cb-ems.json' }
    }
    ['cb-consumption-ledger', 'cb-grant-orchestrator'].each { service ->
        from("../scripts/${service}/tracelens.json") {
            into 'tracelens-setup'
            rename { "${service}.json" }
        }
    }
    // One UI source of truth during migration. No Python modules are packaged.
    from('../tracelens-cli/tracelens_cli/web') {
        into 'tracelens-web'
    }
}

test {
    useJUnitPlatform()
}
